# Workflow CI/CD para Backend ASP.NET Core
# Este workflow realiza: CI (build, test) y publica la imagen Docker en GitHub Container Registry

name: CI/CD Backend

# Eventos que activan el workflow
on:
  # Se ejecuta al hacer push a la rama main
  push:
    branches: [ main ]
  # Se ejecuta al crear pull requests hacia la rama main
  pull_request:
    branches: [ main ]

# Variables de entorno globales para el workflow
env:
  # Nombre del registry de GitHub Container Registry
  REGISTRY: ghcr.io
  # Nombre base de la imagen Docker
  IMAGE_NAME: uni-chat-backend

jobs:
  # Job: Continuous Integration (CI)
  # Objetivo: Compilar y validar el código .NET
  ci:
    # Ejecutar en Ubuntu Latest
    runs-on: ubuntu-latest
    
    # Pasos del job CI
    steps:
      # Paso 1: Obtener el código del repositorio
      # Usa la acción oficial de checkout para clonar el repo
      - name: Checkout del código
        uses: actions/checkout@v4
      
      # Paso 2: Configurar .NET SDK
      # Instala la versión 10.0 de .NET SDK necesaria para el proyecto
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      # Paso 3: Restaurar dependencias NuGet
      # Descarga todos los paquetes NuGet necesarios para el proyecto
      - name: Restore de dependencias
        run: dotnet restore uni-chat-backend/uni-chat-backend.csproj
      
      # Paso 4: Compilar el proyecto
      # Build en configuración Release para optimización
      # --no-restore para no repetir el paso anterior
      - name: Build del proyecto
        run: dotnet build uni-chat-backend/uni-chat-backend.csproj --configuration Release --no-restore
      
      # Paso 5: Ejecutar tests
      # Ejecuta los tests unitarios si existen
      # --no-build para usar el compilado del paso anterior
      - name: Ejecutar tests
        run: dotnet test uni-chat-backend/uni-chat-backend.csproj --no-build --configuration Release

  # Job: Docker Build & Push
  # Objetivo: Construir y publicar la imagen Docker en GHCR
  # Depende del job CI (solo se ejecuta si CI pasa)
  docker:
    needs: ci
    runs-on: ubuntu-latest
    
    # Permisos necesarios para publicar en GHCR
    permissions:
      contents: read
      packages: write
    
    # Pasos del job Docker
    steps:
      # Paso 1: Obtener el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4
      
      # Paso 2: Configurar Docker Buildx
      # Buildx permite builds multi-plataforma y features avanzadas
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Paso 3: Login a GitHub Container Registry
      # Usa GITHUB_TOKEN para autenticación automática
      # GITHUB_TOKEN es proporcionado automáticamente por GitHub Actions
      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Paso 4: Extraer metadatos de la imagen
      # Genera tags y labels automáticamente basados en el repo y commit
      - name: Extraer metadatos de Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag 'latest' para la versión más reciente
            type=ref,event=branch
            # Tag con el SHA del commit para trazabilidad
            type=sha,prefix=
      
      # Paso 5: Build y Push de la imagen Docker
      # Construye la imagen y la publica en GHCR
      # Usa cache para acelerar builds futuros
      - name: Build y Push de imagen Docker
        uses: docker/build-push-action@v5
        with:
          # Contexto del build: carpeta del proyecto
          context: ./uni-chat-backend
          # Habilitar push al registry
          push: true
          # Tags generados en el paso anterior
          tags: ${{ steps.meta.outputs.tags }}
          # Labels generados en el paso anterior
          labels: ${{ steps.meta.outputs.labels }}
          # Cache de capas Docker para acelerar builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
